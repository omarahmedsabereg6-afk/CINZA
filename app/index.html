<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         values under notches / Dynamic Island / Android cutouts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08090B" />
    <meta name="description" content="CINZA identifies movies and TV series from a screenshot or a scene." />

    <!-- Block zoom-jank and unintended pull-to-refresh inside the webview -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CINZA" />

    <title>CINZA — What movie is this?</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/img/logo.svg" />

    <!-- Critical tokens first so the very first paint has the right palette. -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/screens.css" />
  </head>

  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <!-- ==================================================================

         external SVG sprites are blocked by several webview CSP configurations.
         All icons are original 24x24 line drawings on a 1.8 stroke.
         ================================================================== -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">

        <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

             Deliberately not derived from any existing brand. -->

            d="M6 15.5V9.5A3.5 3.5 0 0 1 9.5 6h6M32.5 6h6A3.5 3.5 0 0 1 42 9.5v6M42 32.5v6a3.5 3.5 0 0 1-3.5 3.5h-6M15.5 42h-6A3.5 3.5 0 0 1 6 38.5v-6"

    <!-- ==================================================================
         App shell
         ================================================================== -->
    <div id="app">
      <div class="offline-bar" id="offline-bar" data-visible="false" aria-hidden="true" role="status" aria-live="polite">
        No internet connection. Showing what is already on this device.
      </div>

      <header class="app-header" id="app-header" role="banner">
        <div class="app-header__bar" id="app-header-bar">
          <div class="app-header__brand">
            <svg class="app-header__logo" aria-hidden="true"><use href="#i-cinza-mark" /></svg>
            <span class="app-header__name">Cinza</span>
          </div>
        </div>
      </header>

      <div class="view-stack">
        <main class="view" id="view" tabindex="-1" role="main" aria-live="polite" aria-busy="false"></main>
      </div>

      <nav class="tabbar" id="tabbar" role="navigation" aria-label="Primary">
        <a class="tabbar__item" href="#/home" data-tab="home">
          <svg aria-hidden="true"><use href="#i-home" /></svg>
          <span>Home</span>
        </a>
        <a class="tabbar__item" href="#/search" data-tab="search">
          <svg aria-hidden="true"><use href="#i-search" /></svg>
          <span>Search</span>
        </a>
        <a class="tabbar__item" href="#/history" data-tab="history">
          <svg aria-hidden="true"><use href="#i-history" /></svg>
          <span>History</span>
        </a>
        <a class="tabbar__item" href="#/watchlist" data-tab="watchlist">
          <svg aria-hidden="true"><use href="#i-bookmark" /></svg>
          <span>Watchlist</span>
        </a>
        <a class="tabbar__item" href="#/profile" data-tab="profile">
          <svg aria-hidden="true"><use href="#i-user" /></svg>
          <span>Profile</span>
        </a>
      </nav>

      <div id="overlay-root"></div>
      <div id="toast-region" role="status" aria-live="polite"></div>
    </div>

    <div id="a11y-live" role="status" aria-live="polite"></div>

    <!-- The whole app boots from one bundled entry point. Source is modular
         ESM under js/; see app/build.mjs for why a bundle is required. -->
    <script src="js/bundle.js"></script>
  </body>
</html>
