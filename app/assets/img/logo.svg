<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="CINZA">
  <!--
    The CINZA mark: a viewfinder frame around a three-blade iris.
    Original artwork — a viewfinder (identify what is in the frame) combined with
    a camera iris (a lens focusing on it). No existing brand is referenced.
  -->
  <defs>
    <linearGradient id="cinza-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141519" />
      <stop offset="1" stop-color="#08090B" />
    </linearGradient>
    <linearGradient id="cinza-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2463B" />
      <stop offset="1" stop-color="#C8342B" />
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="11" fill="url(#cinza-bg)" />

  <g fill="none" stroke="url(#cinza-accent)" stroke-linecap="round">
    <!-- viewfinder corners -->
    <path
      d="M9 16.5V12a3 3 0 0 1 3-3h4.5M31.5 9H36a3 3 0 0 1 3 3v4.5M39 31.5V36a3 3 0 0 1-3 3h-4.5M16.5 39H12a3 3 0 0 1-3-3v-4.5"
      stroke-width="2.6"
    />
    <!-- iris -->
    <path d="M24 15.5 33.5 21v11L24 37.5 14.5 32V21L24 15.5Z" stroke-width="1.6" opacity="0.5" />
    <path d="M24 15.5 33.5 32M33.5 21 24 37.5M14.5 21l9.5 16.5" stroke-width="2" />
  </g>
</svg>
