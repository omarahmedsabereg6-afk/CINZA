<!-- Inline notice. Variants: info | warn | error | mock -->
<div class="banner banner--{{variant}}" role="{{role}}" data-role="banner">
  <svg aria-hidden="true"><use href="#{{icon}}" /></svg>
  <div>
    <strong class="banner__title" data-if="title">{{title}}</strong>
    <span>{{text}}</span>
  </div>
</div>
