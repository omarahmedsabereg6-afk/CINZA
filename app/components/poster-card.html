<!-- Poster card. data-* hooks are filled by components.js from the template. -->
<button class="poster-card" data-role="poster-card" type="button">
  <span class="poster-card__art" data-role="art"></span>
  <span class="poster-card__title">{{title}}</span>
  <span class="poster-card__meta" data-if="meta">{{meta}}</span>
</button>
