<!-- Empty / error state. `art` is an icon id, `action` labels a single button. -->
<div class="empty">
  <svg class="empty__art" aria-hidden="true"><use href="#{{art}}" /></svg>
  <p class="empty__title">{{title}}</p>
  <p class="empty__text" data-if="text">{{text}}</p>
  <div class="empty__actions" data-role="actions"></div>
</div>
