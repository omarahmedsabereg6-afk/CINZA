<!-- One scored signal in the "Why this match" panel. -->
<div class="signal">
  <div class="signal__top">
    <span class="signal__name">{{name}}</span>
    <span class="signal__score">{{score}}%</span>
  </div>
  <div class="signal__bar"><div class="signal__fill" style="width: {{score}}%"></div></div>
  <p class="signal__detail" data-if="detail">{{detail}}</p>
</div>
